operations:
  _app_conversations__id__read_receive_markStompMessageAsRead:
    action: receive
    channel:
      $ref: "#/channels/_app_conversations__id__read"
    title: _app_conversations__id__read_receive
    description: Client marks a message as read in a conversation over WebSocket.
    bindings:
      stomp: {}
    messages:
      - $ref: "#/channels/_app_conversations__id__read/messages/com.orbit.message.dto.ReadReceiptRequest"
  _app_conversations__id__send_receive_sendStompMessage:
    action: receive
    channel:
      $ref: "#/channels/_app_conversations__id__send"
    title: _app_conversations__id__send_receive
    description: Client sends a real-time message to a conversation over WebSocket.
    bindings:
      stomp: {}
    messages:
      - $ref: "#/channels/_app_conversations__id__send/messages/com.orbit.message.dto.SendMessageRequest"
    reply:
      channel:
        $ref: "#/channels/_queue_receipts"
      messages:
        - $ref: "#/channels/_queue_receipts/messages/com.orbit.message.dto.MessageResponse"
  _app_conversations__id__typing_receive_handleTyping:
    action: receive
    channel:
      $ref: "#/channels/_app_conversations__id__typing"
    title: _app_conversations__id__typing_receive
    description: Client signals ephemeral typing status (typing=true/false) in a conversation.
    bindings:
      stomp: {}
    messages:
      - $ref: "#/channels/_app_conversations__id__typing/messages/com.orbit.presence.dto.TypingRequest"
  _topic_conversations__conversationId__messages_deleted_send_handleMessageDeleted:
    action: send
    channel:
      $ref: "#/channels/_topic_conversations__conversationId__messages_deleted"
    title: _topic_conversations__conversationId__messages_deleted_send
    description: Broadcasts message deletion notifications to all subscribers in the
      conversation.
    bindings:
      stomp: {}
    messages:
      - $ref: "#/channels/_topic_conversations__conversationId__messages_deleted/messages/com.orbit.message.dto.MessageDeletedNotification"
  _topic_conversations__conversationId__messages_edited_send_handleMessageEdited:
    action: send
    channel:
      $ref: "#/channels/_topic_conversations__conversationId__messages_edited"
