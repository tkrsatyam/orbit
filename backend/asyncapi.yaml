asyncapi: 3.1.0
info:
  title: Orbit Real-Time API (WebSocket & Kafka)
  version: 1.0.0
  description: |
    AsyncAPI specification for Orbit real-time events, STOMP destinations over WebSocket, and Kafka multi-instance fan-out topics.

    ### WebSocket Connection & Handshake
    - **Endpoint**: `ws://localhost:8080/ws` (with SockJS fallback at `/ws`)
    - **Authentication**: JWT access token passed as query param (`?token=<jwt>`).
    - **Close Code**: Invalid or expired token results in connection termination with close code `4401`.
  x-generator: springwolf
defaultContentType: application/json
servers:
  kafka-cluster:
    host: localhost:9092
    protocol: kafka
    description: Kafka cluster for multi-instance event distribution
  websocket-broker:
    host: localhost:8080
    protocol: ws
    pathname: /ws
    description: Orbit STOMP WebSocket broker endpoint
channels:
  _app_conversations__id__read:
    address: "/app/conversations/{id}/read"
    messages:
      com.orbit.message.dto.ReadReceiptRequest:
        $ref: "#/components/messages/com.orbit.message.dto.ReadReceiptRequest"
    bindings: {}
  _app_conversations__id__send:
    address: "/app/conversations/{id}/send"
    messages:
      com.orbit.message.dto.SendMessageRequest:
        $ref: "#/components/messages/com.orbit.message.dto.SendMessageRequest"
    bindings: {}
  _app_conversations__id__typing:
    address: "/app/conversations/{id}/typing"
    messages:
      com.orbit.presence.dto.TypingRequest:
        $ref: "#/components/messages/com.orbit.presence.dto.TypingRequest"
    bindings: {}
  _queue_receipts:
    address: /queue/receipts
    messages:
      com.orbit.message.dto.MessageResponse:
        $ref: "#/components/messages/com.orbit.message.dto.MessageResponse"
    bindings:
      stomp: {}
  _topic_conversations__conversationId__messages:
    address: "/topic/conversations/{conversationId}/messages"
    messages:
      com.orbit.message.dto.MessageResponse:
        $ref: "#/components/messages/com.orbit.message.dto.MessageResponse"
    bindings: {}
  _topic_conversations__conversationId__messages_deleted:
    address: "/topic/conversations/{conversationId}/messages/deleted"
    messages:
      com.orbit.message.dto.MessageDeletedNotification:
        $ref: "#/components/messages/com.orbit.message.dto.MessageDeletedNotification"
    bindings: {}
  _topic_conversations__conversationId__messages_edited:
    address: "/topic/conversations/{conversationId}/messages/edited"
    messages:
      com.orbit.message.dto.MessageEditedNotification:
        $ref: "#/components/messages/com.orbit.message.dto.MessageEditedNotification"
    bindings: {}
  _topic_conversations__conversationId__read:
    address: "/topic/conversations/{conversationId}/read"
    messages:
      com.orbit.message.dto.ReadReceiptNotification:
        $ref: "#/components/messages/com.orbit.message.dto.ReadReceiptNotification"
    bindings: {}
  _topic_conversations__conversationId__typing:
    address: "/topic/conversations/{conversationId}/typing"
    messages:
      com.orbit.presence.dto.TypingNotification:
        $ref: "#/components/messages/com.orbit.presence.dto.TypingNotification"
    bindings: {}
  _topic_presence__userId_:
    address: "/topic/presence/{userId}"
    messages:
      com.orbit.presence.dto.PresenceNotification:
        $ref: "#/components/messages/com.orbit.presence.dto.PresenceNotification"
    bindings: {}
  _user_queue_notifications:
    address: /user/queue/notifications
    messages:
      com.orbit.notification.dto.NotificationPayload:
        $ref: "#/components/messages/com.orbit.notification.dto.NotificationPayload"
    bindings: {}
  chat.messages:
    address: chat.messages
    messages:
      com.orbit.message.kafka.MessageDeliveryEvent:
        $ref: "#/components/messages/com.orbit.message.kafka.MessageDeliveryEvent"
    bindings:
      kafka:
        bindingVersion: 0.5.0
  chat.messages.deleted:
    address: chat.messages.deleted
    messages:
      com.orbit.message.kafka.MessageDeletedEvent:
        $ref: "#/components/messages/com.orbit.message.kafka.MessageDeletedEvent"
    bindings:
      kafka:
        bindingVersion: 0.5.0
  chat.messages.edited:
    address: chat.messages.edited
    messages:
      com.orbit.message.kafka.MessageEditedEvent:
        $ref: "#/components/messages/com.orbit.message.kafka.MessageEditedEvent"
    bindings:
      kafka:
        bindingVersion: 0.5.0
  chat.messages.read:
    address: chat.messages.read
    messages:
      com.orbit.message.kafka.MessageReadEvent:
        $ref: "#/components/messages/com.orbit.message.kafka.MessageReadEvent"
    bindings:
      kafka:
        bindingVersion: 0.5.0
  chat.notifications:
    address: chat.notifications
    messages:
      com.orbit.notification.dto.NotificationEvent:
        $ref: "#/components/messages/com.orbit.notification.dto.NotificationEvent"
    bindings:
      kafka:
        bindingVersion: 0.5.0
  chat.presence:
    address: chat.presence
    messages:
      com.orbit.presence.dto.PresenceEvent:
        $ref: "#/components/messages/com.orbit.presence.dto.PresenceEvent"
      com.orbit.presence.dto.TypingEvent:
        $ref: "#/components/messages/com.orbit.presence.dto.TypingEvent"
      java.lang.Object:
        $ref: "#/components/messages/java.lang.Object"
    bindings:
      kafka:
        bindingVersion: 0.5.0
components:
  schemas:
    HeadersNotDocumented:
      title: HeadersNotDocumented
      type: object
      properties: {}
      description: "There can be headers, but they are not explicitly documented."
      examples:
        - {}
    SpringKafkaDefaultHeaders-MessageDeletedEvent:
      title: SpringKafkaDefaultHeaders-MessageDeletedEvent
      type: object
      properties:
        __TypeId__:
          title: __TypeId__
          type: string
          description: Spring Type Id Header
          examples:
            - com.orbit.message.kafka.MessageDeletedEvent
          const: com.orbit.message.kafka.MessageDeletedEvent
      examples:
        - __TypeId__: com.orbit.message.kafka.MessageDeletedEvent
    SpringKafkaDefaultHeaders-MessageDeliveryEvent:
      title: SpringKafkaDefaultHeaders-MessageDeliveryEvent
