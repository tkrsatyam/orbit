    bindings:
      stomp: {}
    messages:
      - $ref: "#/channels/_topic_conversations__conversationId__messages_edited/messages/com.orbit.message.dto.MessageEditedNotification"
  _topic_conversations__conversationId__messages_send_handleChatMessage:
    action: send
    channel:
      $ref: "#/channels/_topic_conversations__conversationId__messages"
    title: _topic_conversations__conversationId__messages_send
    description: Broadcasts new message delivery event to all connected subscribers
      in the conversation.
    bindings:
      stomp: {}
    messages:
      - $ref: "#/channels/_topic_conversations__conversationId__messages/messages/com.orbit.message.dto.MessageResponse"
  _topic_conversations__conversationId__read_send_handleMessageRead:
    action: send
    channel:
      $ref: "#/channels/_topic_conversations__conversationId__read"
    title: _topic_conversations__conversationId__read_send
    description: Broadcasts read receipt status transitions to conversation participants.
    bindings:
      stomp: {}
    messages:
      - $ref: "#/channels/_topic_conversations__conversationId__read/messages/com.orbit.message.dto.ReadReceiptNotification"
  _topic_conversations__conversationId__typing_send_handleTyping:
    action: send
    channel:
      $ref: "#/channels/_topic_conversations__conversationId__typing"
    title: _topic_conversations__conversationId__typing_send
    description: Broadcasts ephemeral typing indicators to conversation participants.
    bindings:
      stomp: {}
    messages:
      - $ref: "#/channels/_topic_conversations__conversationId__typing/messages/com.orbit.presence.dto.TypingNotification"
  _topic_presence__userId__send_handlePresence:
    action: send
    channel:
      $ref: "#/channels/_topic_presence__userId_"
    title: _topic_presence__userId__send
    description: Broadcasts user online/offline status and lastSeen timestamp updates
      to contacts and group members.
    bindings:
      stomp: {}
    messages:
      - $ref: "#/channels/_topic_presence__userId_/messages/com.orbit.presence.dto.PresenceNotification"
  _user_queue_notifications_send_handleNotification:
    action: send
    channel:
      $ref: "#/channels/_user_queue_notifications"
    title: _user_queue_notifications_send
    description: "Pushes real-time personal notification (unread count, mention) to\
      \ user private queue."
    bindings:
      stomp: {}
    messages:
      - $ref: "#/channels/_user_queue_notifications/messages/com.orbit.notification.dto.NotificationPayload"
