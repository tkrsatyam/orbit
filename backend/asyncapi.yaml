      examples:
        - __TypeId__: com.orbit.message.kafka.MessageDeliveryEvent
    SpringKafkaDefaultHeaders-MessageEditedEvent:
      title: SpringKafkaDefaultHeaders-MessageEditedEvent
      type: object
      properties:
        __TypeId__:
          title: __TypeId__
