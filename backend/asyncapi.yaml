          description: Spring Type Id Header
          examples:
            - com.orbit.message.kafka.MessageEditedEvent
          const: com.orbit.message.kafka.MessageEditedEvent
      examples:
        - __TypeId__: com.orbit.message.kafka.MessageEditedEvent
    SpringKafkaDefaultHeaders-MessageReadEvent:
      title: SpringKafkaDefaultHeaders-MessageReadEvent
      type: object
      properties:
        __TypeId__:
          title: __TypeId__
          type: string
          description: Spring Type Id Header
          examples:
            - com.orbit.message.kafka.MessageReadEvent
          const: com.orbit.message.kafka.MessageReadEvent
      examples:
        - __TypeId__: com.orbit.message.kafka.MessageReadEvent
    SpringKafkaDefaultHeaders-NotificationEvent:
      title: SpringKafkaDefaultHeaders-NotificationEvent
      type: object
      properties:
        __TypeId__:
          title: __TypeId__
          type: string
          description: Spring Type Id Header
          examples:
            - com.orbit.notification.dto.NotificationEvent
          const: com.orbit.notification.dto.NotificationEvent
      examples:
        - __TypeId__: com.orbit.notification.dto.NotificationEvent
    SpringKafkaDefaultHeaders-Object:
      title: SpringKafkaDefaultHeaders-Object
      type: object
      properties:
        __TypeId__:
          title: __TypeId__
          type: string
          description: Spring Type Id Header
          examples:
            - java.lang.Object
          const: java.lang.Object
      examples:
        - __TypeId__: java.lang.Object
    SpringStompDefaultHeaders:
      title: SpringStompDefaultHeaders
      type: object
      properties: {}
      examples:
        - {}
    com.orbit.message.dto.MessageDeletedNotification:
      title: MessageDeletedNotification
      type: object
      properties:
        messageId:
          type: string
          description: ID of deleted message
      description: "Payload broadcast to /topic/conversations/{id}/messages/deleted"
      examples:
        - messageId: string
    com.orbit.message.dto.MessageEditedNotification:
      title: MessageEditedNotification
      type: object
      properties:
        content:
          type: string
          description: Updated content
        editedAt:
          type: string
          description: Timestamp when message was edited
          format: date-time
        messageId:
          type: string
          description: ID of edited message
      description: "Payload broadcast to /topic/conversations/{id}/messages/edited"
      examples:
        - content: string
          editedAt: 2015-07-20T15:49:04-07:00
          messageId: string
    com.orbit.message.dto.MessageResponse:
      title: MessageResponse
      type: object
      properties:
        content:
          type: string
          description: Message text content
          examples:
            - Hey! Have you checked the latest ADR?
        conversationId:
          type: string
          description: Conversation ID
          examples:
            - 60c72b2f9b1d8b2bad000002
        createdAt:
          type: string
          description: Timestamp when message was created
          format: date-time
        deleted:
          type: boolean
          description: Soft delete indicator
          examples:
            - false
        deliveryStatus:
          title: MessageDeliveryStatus
          type: string
          description: Delivery status of a message
          enum:
            - SENDING
            - SENT
            - DELIVERED
            - READ
            - FAILED
          examples:
            - DELIVERED
        edited:
          type: boolean
          description: Edited indicator
          examples:
            - false
        editedAt:
          type: string
          description: "Timestamp when message was edited, or null if unedited"
          format: date-time
        id:
          type: string
          description: Unique message ID
          examples:
            - 60c72b2f9b1d8b2bad000001
        idempotencyKey:
          type: string
          description: Client idempotency key if provided
          examples:
            - a1b2c3d4-e5f6-7890-abcd-ef1234567890
        readBy:
          title: List
          type: array
          description: User IDs who have read this message
          items:
            type: string
            description: User IDs who have read this message
        senderId:
          type: string
          description: Sender user ID
          examples:
            - 60c72b2f9b1d8b2bad000003
        senderName:
          type: string
          description: Sender display name snapshot
          examples:
            - Satyam Kumar
        type:
          title: MessageType
          type: string
          description: Message type
          enum:
            - TEXT
            - IMAGE
            - FILE
          examples:
            - TEXT
      description: Response representation of a message
      examples:
        - content: Hey! Have you checked the latest ADR?
          conversationId: 60c72b2f9b1d8b2bad000002
          createdAt: 2015-07-20T15:49:04-07:00
          deleted: false
          deliveryStatus: DELIVERED
          edited: false
          editedAt: 2015-07-20T15:49:04-07:00
          id: 60c72b2f9b1d8b2bad000001
          idempotencyKey: a1b2c3d4-e5f6-7890-abcd-ef1234567890
          readBy:
            - string
          senderId: 60c72b2f9b1d8b2bad000003
          senderName: Satyam Kumar
          type: TEXT
    com.orbit.message.dto.ReadReceiptNotification:
      title: ReadReceiptNotification
      type: object
      properties:
        messageId:
          type: string
          description: Message ID that was read
          examples:
            - 60c72b2f9b1d8b2bad000001
        readAt:
          type: string
          description: Timestamp when the message was marked as read
          format: date-time
        userId:
          type: string
          description: ID of user who read the message
          examples:
            - 60c72b2f9b1d8b2bad000002
      description: WebSocket payload fanned out when a message is read
      examples:
        - messageId: 60c72b2f9b1d8b2bad000001
          readAt: 2015-07-20T15:49:04-07:00
          userId: 60c72b2f9b1d8b2bad000002
    com.orbit.message.dto.ReadReceiptRequest:
      title: ReadReceiptRequest
      type: object
      properties:
        messageId:
          type: string
          description: Unique identifier of the message marked as read
          minLength: 1
          examples:
            - 60c72b2f9b1d8b2bad000001
      description: Payload to mark a message as read
      examples:
        - messageId: 60c72b2f9b1d8b2bad000001
      required:
        - messageId
    com.orbit.message.dto.SendMessageRequest:
      title: SendMessageRequest
      type: object
      properties:
        content:
          type: string
          description: Content text of the message
          minLength: 1
          maxLength: 4000
          examples:
            - Hey! Have you checked the latest ADR?
        idempotencyKey:
          type:
            - string
            - "null"
          description: Client-generated idempotency key (UUID)
          examples:
            - c8f2b7a4-3995-4672-9a0f-1558914619a9
        type:
          title: MessageType
          type: string
          description: Message type
          enum:
            - TEXT
            - IMAGE
            - FILE
          examples:
            - TEXT
      description: Payload to send a message within a conversation
      examples:
        - content: Hey! Have you checked the latest ADR?
          idempotencyKey: c8f2b7a4-3995-4672-9a0f-1558914619a9
          type: TEXT
      required:
        - content
    com.orbit.message.kafka.MessageDeletedEvent:
      title: MessageDeletedEvent
      type: object
      properties:
        conversationId:
          type: string
        messageId:
          type: string
        recipientIds:
          title: List
          type: array
          items:
            type: string
      examples:
        - conversationId: string
          messageId: string
          recipientIds:
            - string
    com.orbit.message.kafka.MessageDeliveryEvent:
      title: MessageDeliveryEvent
      type: object
      properties:
        conversationId:
          type: string
        message:
          $ref: "#/components/schemas/com.orbit.message.dto.MessageResponse"
        messageId:
          type: string
        recipientIds:
          title: List
          type: array
          items:
            type: string
        senderId:
          type: string
      examples:
        - conversationId: string
          message:
            content: Hey! Have you checked the latest ADR?
            conversationId: 60c72b2f9b1d8b2bad000002
            createdAt: 2015-07-20T15:49:04-07:00
            deleted: false
            deliveryStatus: DELIVERED
            edited: false
            editedAt: 2015-07-20T15:49:04-07:00
            id: 60c72b2f9b1d8b2bad000001
            idempotencyKey: a1b2c3d4-e5f6-7890-abcd-ef1234567890
            readBy:
              - string
            senderId: 60c72b2f9b1d8b2bad000003
            senderName: Satyam Kumar
            type: TEXT
          messageId: string
          recipientIds:
            - string
          senderId: string
    com.orbit.message.kafka.MessageEditedEvent:
      title: MessageEditedEvent
      type: object
      properties:
        content:
          type: string
        conversationId:
          type: string
        editedAt:
          type: string
          format: date-time
        messageId:
          type: string
        recipientIds:
          title: List
          type: array
          items:
            type: string
      examples:
        - content: string
          conversationId: string
          editedAt: 2015-07-20T15:49:04-07:00
          messageId: string
          recipientIds:
            - string
    com.orbit.message.kafka.MessageReadEvent:
      title: MessageReadEvent
      type: object
      properties:
        conversationId:
          type: string
        messageId:
          type: string
        readAt:
          type: string
          format: date-time
        userId:
          type: string
      examples:
        - conversationId: string
          messageId: string
          readAt: 2015-07-20T15:49:04-07:00
          userId: string
    com.orbit.notification.dto.NotificationEvent:
      title: NotificationEvent
      type: object
      properties:
        payload:
          $ref: "#/components/schemas/com.orbit.notification.dto.NotificationPayload"
        userId:
          type: string
          description: Recipient user ID
          examples:
            - 64f1a2b3c4d5e6f7a8b9c0d2
      description: Kafka event for chat.notifications topic
      examples:
        - payload:
            conversationId: 64f1a2b3c4d5e6f7a8b9c0e1
            count: 5
            type: UNREAD_COUNT
          userId: 64f1a2b3c4d5e6f7a8b9c0d2
    com.orbit.notification.dto.NotificationPayload:
      title: NotificationPayload
      type: object
      properties:
        conversationId:
          type: string
          description: ID of associated conversation
          examples:
            - 64f1a2b3c4d5e6f7a8b9c0e1
        count:
          type: integer
          description: Unread count for the conversation
          format: int32
          examples:
            - 5
        type:
          type: string
          description: Notification type
          examples:
            - UNREAD_COUNT
      description: Real-time personal notification payload
      examples:
        - conversationId: 64f1a2b3c4d5e6f7a8b9c0e1
          count: 5
          type: UNREAD_COUNT
    com.orbit.presence.dto.PresenceEvent:
      title: PresenceEvent
      type: object
      properties:
        lastSeen:
          type: string
          format: date-time
        online:
          type: boolean
        userId:
          type: string
      examples:
        - lastSeen: 2015-07-20T15:49:04-07:00
          online: true
          userId: string
    com.orbit.presence.dto.PresenceNotification:
      title: PresenceNotification
      type: object
      properties:
        lastSeen:
          type: string
          description: Timestamp when user was last seen
          format: date-time
        online:
          type: boolean
          description: "True if currently online, false otherwise"
          examples:
            - true
        userId:
          type: string
          description: User ID whose presence state updated
          examples:
            - 60c72b2f9b1d8b2bad000001
      description: WebSocket notification payload for user presence updates
      examples:
        - lastSeen: 2015-07-20T15:49:04-07:00
          online: true
          userId: 60c72b2f9b1d8b2bad000001
    com.orbit.presence.dto.TypingEvent:
      title: TypingEvent
      type: object
      properties:
        conversationId:
          type: string
        displayName:
          type: string
        typing:
          type: boolean
        userId:
          type: string
      examples:
        - conversationId: string
          displayName: string
          typing: true
          userId: string
    com.orbit.presence.dto.TypingNotification:
      title: TypingNotification
      type: object
      properties:
        displayName:
          type: string
          description: Display name of user who is typing
        typing:
          type: boolean
          description: Whether user is actively typing
        userId:
          type: string
          description: ID of user who is typing
      description: "Payload broadcast to /topic/conversations/{conversationId}/typing"
      examples:
        - displayName: string
          typing: true
          userId: string
    com.orbit.presence.dto.TypingRequest:
      title: TypingRequest
      type: object
      properties:
        typing:
          type: boolean
      examples:
        - typing: true
      required:
        - typing
    java.lang.Object:
      type: object
      examples:
        - {}
  messages:
    com.orbit.message.dto.MessageDeletedNotification:
      headers:
        $ref: "#/components/schemas/HeadersNotDocumented"
      payload:
        schemaFormat: application/vnd.aai.asyncapi+json;version=3.1.0
