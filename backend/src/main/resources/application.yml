spring:
  application:
    name: orbit
  config:
    import: "optional:file:.env[.properties]"
  mongodb:
    uri: ${MONGODB_URI}
  data:
    mongodb:
      auto-index-creation: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

orbit:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry-ms: ${JWT_ACCESS_TOKEN_EXPIRY_MS:900000}
    refresh-token-expiry-ms: ${JWT_REFRESH_TOKEN_EXPIRY_MS:604800000}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  cookie:
    secure: ${COOKIE_SECURE:true}
    same-site: ${COOKIE_SAME_SITE:None}
  rate-limit:
    auth-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:10}
    messages-per-minute: ${RATE_LIMIT_MESSAGES_PER_MINUTE:60}
    uploads-per-minute: ${RATE_LIMIT_UPLOADS_PER_MINUTE:10}
    ai-requests-per-minute: ${RATE_LIMIT_AI_PER_MINUTE:20}
    default-per-minute: ${RATE_LIMIT_DEFAULT_PER_MINUTE:100}