spring:
  application:
    name: orbit
  config:
    import: "optional:file:.env[.properties]"
  mongodb:
    uri: ${MONGODB_URI}
  data:
    mongodb:
      auto-index-creation: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      retries: 3
    consumer:
      group-id: orbit-websocket-group
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.orbit.*"

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  packages-to-scan: com.orbit

springwolf:
  enabled: true
  docket:
    base-package: com.orbit
    info:
      title: Orbit Real-Time API (WebSocket & Kafka)
      version: 1.0.0
      description: |
        AsyncAPI specification for Orbit real-time events, STOMP destinations over WebSocket, and Kafka multi-instance fan-out topics.
        
        ### WebSocket Connection & Handshake
        - **Endpoint**: `ws://localhost:8080/ws` (with SockJS fallback at `/ws`)
        - **Authentication**: JWT access token passed as query param (`?token=<jwt>`).
        - **Close Code**: Invalid or expired token results in connection termination with close code `4401`.
    servers:
      websocket-broker:
        protocol: ws
        host: localhost:8080
        pathname: /ws
        description: Orbit STOMP WebSocket broker endpoint
      kafka-cluster:
        protocol: kafka
        host: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
        description: Kafka cluster for multi-instance event distribution

orbit:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry-ms: ${JWT_ACCESS_TOKEN_EXPIRY_MS:900000}
    refresh-token-expiry-ms: ${JWT_REFRESH_TOKEN_EXPIRY_MS:604800000}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:4200}
  cookie:
    secure: ${COOKIE_SECURE:true}
    same-site: ${COOKIE_SAME_SITE:None}
  rate-limit:
    auth-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:10}
    messages-per-minute: ${RATE_LIMIT_MESSAGES_PER_MINUTE:60}
    uploads-per-minute: ${RATE_LIMIT_UPLOADS_PER_MINUTE:10}
    ai-requests-per-minute: ${RATE_LIMIT_AI_PER_MINUTE:20}
    default-per-minute: ${RATE_LIMIT_DEFAULT_PER_MINUTE:100}