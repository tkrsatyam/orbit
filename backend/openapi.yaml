openapi: 3.1.0
info:
  title: Orbit API
  description: Real-time chat API for connecting over shared professional goals.
  version: v1
servers:
- url: http://localhost
  description: Generated server url
security:
- bearerAuth: []
tags:
- name: Groups
  description: "Group CRUD, membership, roles, and invite links"
- name: Contacts
  description: "Contact requests, connection management, and relationships"
- name: User
  description: User profile management
- name: Auth
  description: Authentication and session management
paths:
  /api/v1/users/{userId}/block:
    post:
      tags:
      - User
      summary: Block a user
      description: "Blocks a user by their userId, establishing a one-directional\
        \ block relationship per ADR 007 and ADR 013"
      operationId: blockUser
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: User blocked successfully
        "400":
          description: Invalid request or attempt to block self
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Missing, invalid, expired, or blacklisted access token"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Target user account not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
      - User
      summary: Unblock a user
      description: "Unblocks a user by their userId, hard-deleting the contact relationship\
        \ per ADR 006 and ADR 013"
      operationId: unblockUser
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: User unblocked successfully
        "400":
          description: Invalid request or attempt to unblock self
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Missing, invalid, expired, or blacklisted access token"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Target user account not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/groups:
    post:
      tags:
      - Groups
      summary: Create a new group
      description: Creates a group and its associated group conversation. Creator
        becomes first Admin.
      operationId: createGroup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupRequest"
        required: true
      responses:
        "201":
          description: Group created successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GroupResponse"
        "400":
          description: Validation failure
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid bearer token
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Group name already taken
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
  /api/v1/groups/{groupId}:
    get:
      tags:
      - Groups
      summary: Get group details
      description: Retrieves group details. Public groups are visible to all users, private groups are member-only.
      operationId: getGroupDetails
      parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Group details retrieved successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GroupResponse"
        "401":
          description: Missing or invalid bearer token
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Group not found or private
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
    patch:
      tags:
      - Groups
      summary: Update group details
      description: Updates group metadata. Admin-only operation.
      operationId: updateGroup
      parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGroupRequest"
        required: true
      responses:
        "200":
          description: Group updated successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GroupResponse"
        "400":
          description: Validation failure
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid bearer token
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Only group admins can update group details
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Group not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Group name already taken
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
  /api/v1/groups/{groupId}/invite:
    post:
      tags:
      - Groups
      summary: Generate group invite link
      description: Generates a 7-day invite link for a private group. Admin-only.
      operationId: createInvite
      parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
      responses:
        "201":
          description: Invite link generated successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/InviteResponse"
        "401":
          description: Missing or invalid bearer token
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: User is not an admin of this group
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Group not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
  /api/v1/groups/{groupId}/members:
    get:
      tags:
      - Groups
      summary: Get group member list
      description: Retrieves all members of a group with their roles. Caller must be a member.
      operationId: getGroupMembers
      parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Member list retrieved successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GroupMemberListResponse"
        "401":
          description: Missing or invalid bearer token
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not a member of the group
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Group not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
  /api/v1/groups/{groupId}/members/{userId}/role:
    patch:
      tags:
      - Groups
      summary: Update member role
      description: Promote or demote a group member. Admin-only operation. Cannot demote sole admin.
      operationId: updateMemberRole
      parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
      - name: userId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberRoleRequest"
        required: true
      responses:
        "200":
          description: Member role updated successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GroupMemberResponse"
        "400":
          description: Validation failure
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid bearer token
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not an admin
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Group or member not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Cannot demote the sole admin
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
  /api/v1/groups/join-via-invite/{inviteToken}:
    post:
      tags:
      - Groups
      summary: Join group via invite link
      description: "Joins a private group using a valid, non-expired invite token."
      operationId: joinViaInvite
      parameters:
      - name: inviteToken
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Successfully joined the group
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GroupJoinResponse"
        "401":
          description: Missing or invalid bearer token
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Invite token not found or expired
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: User is already a member of this group
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
  /api/v1/contacts/requests:
    get:
      tags:
      - Contacts
      summary: Get pending incoming connection requests
      description: Retrieves all pending incoming connection requests for the authenticated
        user
      operationId: getIncomingRequests
      responses:
        "200":
          description: Pending requests retrieved successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/IncomingRequestsResponse"
        "401":
          description: "Missing, invalid, expired, or blacklisted access token"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
      - Contacts
      summary: Send a connection request
      description: Sends an outbound connection request to another user
      operationId: sendRequest
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendRequestDto"
        required: true
      responses:
        "201":
          description: Connection request created successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ConnectionRequestResponse"
        "400":
          description: Invalid request payload or attempting to connect to self
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Missing, invalid, expired, or blacklisted access token"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Target user account not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Request already exists, users are already connected, or blocked\
            \ relationship"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/register:
    post:
      tags:
      - Auth
      summary: Register user
      description: "Creates a new user account, sets the refresh token cookie, and\
        \ returns the access token with user details"
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "201":
          description: Account successfully created; Set-Cookie header contains initial
            refresh token
          headers:
            Set-Cookie:
              description: HttpOnly refresh cookie
              style: simple
              schema:
                type: string
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: "Validation failure (invalid email, weak password, or display\
            \ name out of range)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email is already registered
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded (10 requests/minute per IP)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/refresh:
    post:
      tags:
      - Auth
      summary: Refresh access token
      description: Rotates the refresh cookie session and issues a new access token
      operationId: refresh
      parameters:
      - name: refreshToken
        in: cookie
        required: false
        schema:
          type: string
      - name: Origin
        in: header
        required: false
        schema:
          type: string
      responses:
        "200":
          description: New access token issued; Set-Cookie header contains rotated
            refresh token
          headers:
            Set-Cookie:
              description: HttpOnly refresh cookie
              style: simple
              schema:
                type: string
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: "Missing, invalid, expired, or already rotated refresh token"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Origin header does not match configured frontend origin
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded (10 requests/minute per IP)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/logout:
    post:
      tags:
      - Auth
      summary: Logout user
      description: "Invalidates the access token, removes the refresh token session,\
        \ updates user presence, and clears the refresh cookie"
      operationId: logout
      parameters:
      - name: refreshToken
        in: cookie
        required: false
        schema:
          type: string
      responses:
        "204":
          description: Session successfully invalidated; Set-Cookie header clears
            the refresh token cookie
          headers:
            Set-Cookie:
              description: Cleared HttpOnly refresh cookie
              style: simple
              schema:
                type: string
        "401":
          description: "Missing, invalid, expired, or blacklisted access token"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded (10 requests/minute per user)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: Authenticate user
      description: "Authenticates an existing user, sets the refresh token cookie,\
        \ and returns the access token with user details"
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: Authentication successful; Set-Cookie header contains initial
            refresh token
          headers:
            Set-Cookie:
              description: HttpOnly refresh cookie
              style: simple
              schema:
                type: string
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation failure (blank email or password)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid email or password
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded (10 requests/minute per IP)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/contacts/requests/{requestId}:
    patch:
      tags:
      - Contacts
      summary: Accept or decline a connection request
      description: Responds to an incoming connection request by accepting or declining
        it
      operationId: respondToRequest
      parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RespondRequestDto"
        required: true
      responses:
        "200":
          description: Connection request accepted successfully and DM conversation
            created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AcceptRequestResponse"
        "204":
          description: Connection request declined and deleted quietly
          content:
            '*/*':
              schema:
                type: object
        "400":
          description: Invalid action or request payload
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Missing, invalid, expired, or blacklisted access token"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Connection request not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Connection request is not in PENDING state
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/users/{userId}:
    get:
      tags:
      - User
      summary: Get user profile by ID
      description: "Returns public profile of a user, or degraded available=false\
        \ if blocked"
      operationId: getUserProfile
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Profile retrieved successfully (normal or degraded)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "401":
          description: "Missing, invalid, expired, or blacklisted access token"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Target user account not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/users/suggested:
    get:
      tags:
      - User
      summary: Get suggested users to connect with
      description: Returns active users excluding the requester and existing contacts/blocks
      operationId: getSuggestedUsers
      responses:
        "200":
          description: Suggested users retrieved successfully
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SuggestedUserResponse"
        "401":
          description: "Missing, invalid, expired, or blacklisted access token"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/users/me:
    get:
      tags:
      - User
      summary: Get current user profile
      description: Returns the authenticated user's own profile including email
      operationId: getSelfProfile
      responses:
        "200":
          description: Profile retrieved successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SelfProfileResponse"
        "401":
          description: "Missing, invalid, expired, or blacklisted access token"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User account not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/groups/mine:
    get:
      tags:
      - Groups
      summary: List current user's groups
      description: Returns all groups that the authenticated user is a member of.
      operationId: getMyGroups
      responses:
        "200":
          description: List of user's joined groups
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupResponse"
        "401":
          description: Missing or invalid bearer token
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
  /api/v1/contacts:
    get:
      tags:
      - Contacts
      summary: Get authenticated user's contact list
      description: Retrieves all established contacts with live presence status for
        the authenticated user
      operationId: getContacts
      responses:
        "200":
          description: Contacts retrieved successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ContactListResponse"
        "401":
          description: "Missing, invalid, expired, or blacklisted access token"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/contacts/{contactId}:
    delete:
      tags:
      - Contacts
      summary: Remove a contact (unfriend)
      description: Permanently removes an established contact relationship quietly
        without lingering status records
      operationId: removeContact
      parameters:
      - name: contactId
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Contact removed successfully
        "401":
          description: "Missing, invalid, expired, or blacklisted access token"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Contact relationship not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    ErrorResponse:
      type: object
      description: Standard API error response envelope
      properties:
        status:
          type: integer
          format: int32
          description: HTTP status code
          example: 400
        error:
          type: string
          description: HTTP status reason phrase
          example: Bad Request
        message:
          type: string
          description: Descriptive error message
          example: Display name must be between 2 and 50 characters
        path:
          type: string
          description: Request URI path
          example: /api/v1/users/me
        timestamp:
          type: string
          format: date-time
          description: ISO-8601 UTC timestamp of the error
          example: 2026-10-18T17:15:00Z
    CreateGroupRequest:
      type: object
      description: Payload for creating a new group
      properties:
        name:
          type: string
          description: Unique group name
          example: FAANG Interview Prep
          maxLength: 100
          minLength: 3
        description:
          type: string
          description: Optional description
          example: Weekly mock interviews and distributed system design
          maxLength: 500
          minLength: 0
        topicTag:
          type: string
          description: Topic tag for categorization
          example: interview-prep
          maxLength: 50
          minLength: 0
        visibility:
          type: string
          description: Visibility determining join mechanism
          enum:
          - PUBLIC
          - PRIVATE
          example: PUBLIC
      required:
      - name
      - visibility
    UpdateGroupRequest:
      type: object
      description: Request payload for updating group metadata (all fields optional)
      properties:
        name:
          type: string
          description: Updated group name
          example: FAANG Interview Prep 2026
          maxLength: 100
          minLength: 3
        description:
          type: string
          description: Updated group description
          example: Updated description
          maxLength: 500
        topicTag:
          type: string
          description: Updated topic tag
          example: "#interview-prep"
          maxLength: 50
    GroupResponse:
      type: object
      description: Group details response
      properties:
        id:
          type: string
          description: Group ID
          example: 64f1a2b3c4d5e6f7a8b9c0e2
        name:
          type: string
          description: Group name
          example: FAANG Interview Prep
        description:
          type: string
          description: Group description
          example: Weekly mock interviews and distributed system design
        topicTag:
          type: string
          description: Topic tag
          example: interview-prep
        visibility:
          type: string
          description: Group visibility
          enum:
          - PUBLIC
          - PRIVATE
          example: PUBLIC
        avatarUrl:
          type: string
          description: Group avatar URL
          example: https://pub-xxx.r2.dev/groups/avatar.jpg
        coverImageUrl:
          type: string
          description: Group cover image URL
          example: https://pub-xxx.r2.dev/groups/cover.jpg
        memberCount:
          type: integer
          format: int32
          description: Number of active members
          example: 1
        conversationId:
          type: string
          description: Associated conversation ID
          example: 64f1a2b3c4d5e6f7a8b9c0e1
        createdAt:
          type: string
          format: date-time
          description: Timestamp of creation
        role:
          type: string
          description: Caller's role within the group
          enum:
          - ADMIN
          - MEMBER
          example: ADMIN
    InviteResponse:
      type: object
      description: Private group invite link response
      properties:
        inviteLink:
          type: string
          description: Full invite URL
          example: http://localhost:4200/invite/a1b2c3d4-e5f6-7890-abcd-ef1234567890
        expiresAt:
          type: string
          format: date-time
          description: Timestamp when the invite expires (7 days after issuance)
    GroupJoinResponse:
      type: object
      description: Response returned upon joining a group
      properties:
        groupId:
          type: string
          description: Group ID
          example: 64f1a2b3c4d5e6f7a8b9c0e2
        conversationId:
          type: string
          description: Conversation ID for messaging
          example: 64f1a2b3c4d5e6f7a8b9c0e1
        role:
          type: string
          description: Role assigned to new member
          enum:
          - ADMIN
          - MEMBER
          example: MEMBER
    GroupMemberListResponse:
      type: object
      description: Wrapper response for group member list
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/GroupMemberResponse"
    GroupMemberResponse:
      type: object
      description: Details of a group member
      properties:
        userId:
          type: string
          description: User ID
          example: 64f1a2b3c4d5e6f7a8b9c0d1
        displayName:
          type: string
          description: User display name
          example: Satyam Kumar
        avatarUrl:
          type: string
          description: User avatar URL
          example: https://pub-xxx.r2.dev/avatars/u1.jpg
        role:
          type: string
          description: Role in group
          enum:
          - ADMIN
          - MEMBER
          example: ADMIN
        online:
          type: boolean
          description: Whether user is online
          example: true
        joinedAt:
          type: string
          format: date-time
          description: Timestamp when user joined group
          example: 2026-06-27T10:30:00Z
    UpdateMemberRoleRequest:
      type: object
      description: Request to update member role in group
      properties:
        role:
          type: string
          description: New role
          enum:
          - ADMIN
          - MEMBER
          example: ADMIN
      required:
      - role
    SendRequestDto:
      type: object
      properties:
        targetUserId:
          type: string
          minLength: 1
      required:
      - targetUserId
    ConnectionRequestResponse:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum:
          - PENDING
          - CONNECTED
          - BLOCKED
        toUser:
          $ref: "#/components/schemas/ContactUserSummaryDto"
        createdAt:
          type: string
          format: date-time
    ContactUserSummaryDto:
      type: object
      properties:
        id:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: string
    RegisterRequest:
      type: object
      description: User registration payload
      properties:
        email:
          type: string
          format: email
          description: User email address
          example: satyam@example.com
          minLength: 1
        password:
          type: string
          description: "Password (minimum 8 characters, at least one uppercase, one\
            \ lowercase, one digit, and one special character)"
          example: StrongP@ssword1
          minLength: 1
          pattern: "^(?=.*[a-z])(?=.*[A-Z])(?=.*\\d)(?=.*[^A-Za-z\\d])\\S{8,}$"
        displayName:
          type: string
          description: User display name (2 to 50 characters)
          example: Satyam
          maxLength: 50
          minLength: 2
      required:
      - displayName
      - email
      - password
    AuthResponse:
      type: object
      description: Authentication response containing the JWT access token and optional
        user profile summary
      properties:
        accessToken:
          type: string
          description: JWT access token used for Bearer authentication
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          type: "null"
          $ref: "#/components/schemas/UserSummaryResponse"
          description: User profile summary (null on token refresh)
    UserSummaryResponse:
      type: object
      description: User profile summary
      properties:
        id:
          type: string
          description: Unique user identifier
          example: 64f1a2b3c4d5e6f7a8b9c0d1
        email:
          type: string
          description: User email address
          example: satyam@example.com
        displayName:
          type: string
          description: User display name
          example: Satyam
        avatarUrl:
          type:
          - string
          - "null"
          description: User avatar image URL
          example: https://pub-xxx.r2.dev/avatars/user-id.jpg
        bio:
          type:
          - string
          - "null"
          description: User profile bio
          example: Career switcher from finance to tech
        createdAt:
          type: string
          format: date-time
          description: ISO-8601 UTC timestamp of account creation
          example: 2026-06-27T10:30:00Z
    LoginRequest:
      type: object
      description: User authentication payload
      properties:
        email:
          type: string
          format: email
          description: User email address
          example: satyam@example.com
          minLength: 1
        password:
          type: string
          description: Account password
          example: StrongP@ssword1
          minLength: 1
      required:
      - email
      - password
    RespondRequestDto:
      type: object
      properties:
        action:
          type: string
          enum:
          - ACCEPT
          - DECLINE
      required:
      - action
    AcceptRequestResponse:
      type: object
      properties:
        status:
          type: string
        conversationId:
          type: string
    UserProfileResponse:
      type: object
      description: Public user profile or masked profile unavailable response
      properties:
        id:
          type: string
          description: Unique user identifier
          example: 64f1a2b3c4d5e6f7a8b9c0d1
        displayName:
          type:
          - string
          - "null"
          description: User display name
          example: Satyam
        avatarUrl:
          type:
          - string
          - "null"
          description: User avatar image URL
          example: https://pub-xxx.r2.dev/avatars/user-id.jpg
        bio:
          type:
          - string
          - "null"
          description: User profile bio
          example: Career switcher from finance to tech
        connectionStatus:
          type:
          - string
          - "null"
          description: Relationship status from the requester's perspective
          enum:
          - NONE
          - PENDING_SENT
          - PENDING_RECEIVED
          - CONNECTED
          - BLOCKED
          example: CONNECTED
        available:
          type:
          - boolean
          - "null"
          description: Availability flag present only when profile is masked due to
            a block
          example: false
    SuggestedUserResponse:
      type: object
      properties:
        id:
          type: string
        displayName:
          type: string
        bio:
          type: string
        avatarUrl:
          type: string
        initials:
          type: string
    SelfProfileResponse:
      type: object
      description: Authenticated user's own profile
      properties:
        id:
          type: string
          description: Unique user identifier
          example: 64f1a2b3c4d5e6f7a8b9c0d1
        email:
          type: string
          description: User email address
          example: satyam@example.com
        displayName:
          type: string
          description: User display name
          example: Satyam
        avatarUrl:
          type:
          - string
          - "null"
          description: User avatar image URL
          example: https://pub-xxx.r2.dev/avatars/user-id.jpg
        bio:
          type:
          - string
          - "null"
          description: User profile bio
          example: Career switcher from finance to tech
        createdAt:
          type: string
          format: date-time
          description: ISO-8601 UTC timestamp of account creation
          example: 2026-06-27T10:30:00Z
    ContactListResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/ContactResponse"
    ContactResponse:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: string
        bio:
          type: string
        online:
          type: boolean
        conversationId:
          type: string
    IncomingRequestDto:
      type: object
      properties:
        id:
          type: string
        fromUser:
          $ref: "#/components/schemas/ContactUserSummaryDto"
        createdAt:
          type: string
          format: date-time
    IncomingRequestsResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/IncomingRequestDto"
  securitySchemes:
    bearerAuth:
      type: http
      description: JWT access token obtained from register or login.
      name: bearerAuth
      scheme: bearer
      bearerFormat: JWT
