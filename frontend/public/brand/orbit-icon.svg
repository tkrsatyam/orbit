<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <!-- Crisp Upper Arc Gradient: Pure White to Slate -->
    <linearGradient id="orbit-slate-arc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#EDEDEF"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Crisp Lower Arc Gradient: Honey Amber to Radiant Gold -->
    <linearGradient id="orbit-amber-arc" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>

    <!-- Radial Core Glow -->
    <radialGradient id="orbit-core-glow" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="45%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </radialGradient>

    <!-- Satellite Halo Filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#F59E0B" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Concentric Gravitational Orbit Ring (Subtle) -->
  <circle cx="50" cy="50" r="16" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.45"/>

  <!-- Lower Orbital Sweep (Warm Amber) -->
  <path d="M 50 84 C 31.22 84 16 68.78 16 50 C 16 40.2 20.2 31.4 26.9 25.2" 
        stroke="url(#orbit-amber-arc)" stroke-width="7" stroke-linecap="round"/>

  <!-- Upper Orbital Sweep (Crisp Slate/White) -->
  <path d="M 50 16 C 68.78 16 84 31.22 84 50 C 84 59.8 79.8 68.6 73.1 74.8" 
        stroke="url(#orbit-slate-arc)" stroke-width="7" stroke-linecap="round"/>

  <!-- Trailing Satellite Node (Top Entrance) -->
  <circle cx="26.9" cy="25.2" r="3.2" fill="#EDEDEF" opacity="0.85"/>

  <!-- Active Orbital Beacon with Amber Corona (Bottom Entrance) -->
  <circle cx="73.1" cy="74.8" r="8" stroke="#F59E0B" stroke-width="1.5" opacity="0.4"/>
  <circle cx="73.1" cy="74.8" r="4.8" fill="#F59E0B" filter="url(#glow)"/>

  <!-- Central Gravitational Core -->
  <circle cx="50" cy="50" r="11" stroke="#F59E0B" stroke-width="1.5" opacity="0.3"/>
  <circle cx="50" cy="50" r="8.5" fill="url(#orbit-core-glow)"/>
</svg>
