<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="squircle-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#121214"/>
    </linearGradient>

    <!-- Ambient Amber Rim Lighting -->
    <radialGradient id="squircle-ambient" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <!-- Upper Slate Arc Gradient -->
    <linearGradient id="app-slate-arc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#EDEDEF"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Lower Amber Arc Gradient -->
    <linearGradient id="app-amber-arc" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>

    <!-- Core Glow -->
    <radialGradient id="app-core-glow" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="45%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </radialGradient>

    <filter id="app-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#F59E0B" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- iOS/macOS Standard Squircle Container (Corner Radius 42 on 192) -->
  <rect x="2" y="2" width="188" height="188" rx="42" fill="url(#squircle-bg)" stroke="#2E2E33" stroke-width="2"/>
  <rect x="2" y="2" width="188" height="188" rx="42" fill="url(#squircle-ambient)"/>

  <!-- Centered Scaled Kinetic "O" Mark (Scale factor: 1.25, Centered at 96, 96) -->
  <g transform="translate(96, 96) scale(1.22) translate(-50, -50)">
    <!-- Concentric Orbit Track -->
    <circle cx="50" cy="50" r="16" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.45"/>

    <!-- Lower Orbital Sweep (Warm Amber) -->
    <path d="M 50 84 C 31.22 84 16 68.78 16 50 C 16 40.2 20.2 31.4 26.9 25.2" 
          stroke="url(#app-amber-arc)" stroke-width="7" stroke-linecap="round"/>

    <!-- Upper Orbital Sweep (Crisp White/Slate) -->
    <path d="M 50 16 C 68.78 16 84 31.22 84 50 C 84 59.8 79.8 68.6 73.1 74.8" 
          stroke="url(#app-slate-arc)" stroke-width="7" stroke-linecap="round"/>

    <!-- Top Entrance Node -->
    <circle cx="26.9" cy="25.2" r="3.2" fill="#EDEDEF" opacity="0.85"/>

    <!-- Bottom Entrance Beacon -->
    <circle cx="73.1" cy="74.8" r="8" stroke="#F59E0B" stroke-width="1.5" opacity="0.4"/>
    <circle cx="73.1" cy="74.8" r="4.8" fill="#F59E0B" filter="url(#app-glow)"/>

    <!-- Core -->
    <circle cx="50" cy="50" r="11" stroke="#F59E0B" stroke-width="1.5" opacity="0.3"/>
    <circle cx="50" cy="50" r="8.5" fill="url(#app-core-glow)"/>
  </g>
</svg>
