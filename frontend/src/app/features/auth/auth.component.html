<div class="auth-page-wrapper">
  <div class="auth-card">
    <div class="auth-brand-header">
      <div class="orbit-badge" aria-hidden="true">
        <img src="brand/orbit-icon.svg" alt="Orbit Logo" class="orbit-brand-mark" width="22" height="22" />
      </div>
      <h1 class="auth-title">Orbit</h1>
    </div>
    <p class="auth-subtitle">
      {{ mode() === 'login' ? 'Welcome back! Sign in to continue.' : 'Create an account to join Orbit.' }}
    </p>

    <div class="tab-header" role="tablist">
      <button
        type="button"
        role="tab"
        (click)="setMode('login')"
        [class.active]="mode() === 'login'"
        [attr.aria-selected]="mode() === 'login'"
        class="tab-button"
      >
        Sign in
      </button>
      <button
        type="button"
        role="tab"
        (click)="setMode('register')"
        [class.active]="mode() === 'register'"
        [attr.aria-selected]="mode() === 'register'"
        class="tab-button"
      >
        Register
      </button>
    </div>

    @if (mode() === 'login') {
      <app-login-form
        [isLoading]="isSubmitting()"
        [error]="formError()"
        (formSubmit)="handleLogin($event)"
      />
    } @else {
      <app-register-form
        [isLoading]="isSubmitting()"
        [error]="formError()"
        (formSubmit)="handleRegister($event)"
      />
    }
  </div>
</div>
