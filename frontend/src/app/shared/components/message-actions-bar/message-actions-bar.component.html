<div
  class="message-actions-bar"
  [class.visible]="isVisible()"
  (click)="$event.stopPropagation()"
  [attr.data-testid]="'message-actions-' + messageId()"
>
  @if (canEdit()) {
    <button
      type="button"
      class="btn-action-item btn-action-edit"
      (click)="edit.emit()"
      title="Edit message"
      [attr.data-testid]="'edit-message-btn-' + messageId()"
    >
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
      </svg>
    </button>
  }
  @if (canDelete()) {
    <button
      type="button"
      class="btn-action-item btn-action-delete"
      (click)="delete.emit()"
      title="Delete message"
      [attr.data-testid]="'delete-message-btn-' + messageId()"
    >
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="3 6 5 6 21 6" />
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
      </svg>
    </button>
  }
</div>
