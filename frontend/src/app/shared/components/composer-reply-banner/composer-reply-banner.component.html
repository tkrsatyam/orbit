<div class="composer-reply-banner" data-testid="composer-reply-banner">
  <div class="reply-info">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="9 17 4 12 9 7" />
      <path d="M20 18v-2a4 4 0 0 0-4-4H4" />
    </svg>
    <div class="reply-text-wrap">
      <span class="reply-title">
        Replying to <span class="reply-sender-name">{{ senderName() }}</span>
      </span>
      <span class="reply-preview" data-testid="reply-preview">{{ previewContent() }}</span>
    </div>
  </div>
  <button
    type="button"
    class="btn-dismiss-reply"
    (click)="dismiss.emit()"
    title="Cancel reply"
    data-testid="cancel-reply-btn"
  >
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <line x1="18" y1="6" x2="6" y2="18" />
      <line x1="6" y1="6" x2="18" y2="18" />
    </svg>
  </button>
</div>
