<div class="composer-editing-banner" data-testid="composer-editing-banner">
  <div class="editing-info">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
      <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
    </svg>
    <div class="editing-text-wrap">
      <span class="editing-title">Editing message</span>
      <span class="editing-preview" data-testid="editing-preview">{{ previewContent() }}</span>
    </div>
  </div>
  <button
    type="button"
    class="btn-cancel-edit"
    (click)="cancel.emit()"
    title="Cancel edit (Esc)"
    data-testid="cancel-edit-btn"
  >
    Cancel
  </button>
</div>
