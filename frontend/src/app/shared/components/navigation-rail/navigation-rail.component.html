<aside class="navigation-rail" data-testid="navigation-rail" aria-label="Main Navigation">
  <div class="rail-top">
    <a routerLink="/" class="rail-brand-squircle" aria-label="Orbit Home" title="Return to Orbit">
      <img src="brand/orbit-icon.svg" alt="Orbit Logo" class="rail-brand-icon" width="26" height="26" />
    </a>

    <nav class="rail-nav-tabs">
      <button
        type="button"
        class="rail-tab-btn"
        [class.active]="activeTab() === 'CHATS'"
        (click)="selectTab('CHATS')"
        title="Direct Messages"
        data-testid="nav-tab-chats"
        aria-label="Direct Messages"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
        </svg>
        @if (incomingCount() > 0) {
          <span class="tab-badge-dot" data-testid="chats-badge-dot"></span>
        }
      </button>

      <button
        type="button"
        class="rail-tab-btn"
        [class.active]="activeTab() === 'GROUPS'"
        (click)="selectTab('GROUPS')"
        title="Groups & Spaces"
        data-testid="nav-tab-groups"
        aria-label="Groups & Spaces"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
          <path d="M16 3.13a4 4 0 0 1 0 7.75" />
        </svg>
      </button>

      <button
        type="button"
        class="rail-tab-btn"
        [class.active]="activeTab() === 'CONTACTS'"
        (click)="selectTab('CONTACTS')"
        title="Contacts"
        data-testid="nav-tab-contacts"
        aria-label="Contacts"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <line x1="19" y1="8" x2="19" y2="14" />
          <line x1="22" y1="11" x2="16" y2="11" />
        </svg>
      </button>

      <button
        type="button"
        class="rail-tab-btn"
        [class.active]="activeTab() === 'DISCOVER'"
        (click)="selectTab('DISCOVER')"
        title="Discover Public Spaces"
        data-testid="nav-tab-discover"
        aria-label="Discover"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10" />
          <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" />
        </svg>
      </button>
    </nav>
  </div>

  <div class="rail-bottom">
    <div class="user-menu-container">
      <button
        type="button"
        class="avatar-badge-btn"
        (click)="toggleMenu($event)"
        [attr.aria-expanded]="isMenuOpen()"
        aria-haspopup="true"
        data-testid="user-avatar-badge"
        [attr.title]="displayName()"
      >
        <app-avatar
          [name]="displayName()"
          [imageUrl]="avatarUrl()"
          size="md"
        />
      </button>

      @if (isMenuOpen()) {
        <div
          class="user-dropdown-menu"
          role="menu"
          data-testid="user-dropdown-menu"
          (click)="$event.stopPropagation()"
        >
          <div class="menu-user-header">
            <span class="menu-user-name">{{ displayName() }}</span>
            @if (email()) {
              <span class="menu-user-email">{{ email() }}</span>
            }
          </div>

          <div class="dropdown-separator" role="separator"></div>

          <button
            type="button"
            class="dropdown-menu-item profile-item"
            role="menuitem"
            (click)="handleOpenProfile()"
            data-testid="menu-my-profile-btn"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
            <span>My profile</span>
          </button>

          <div class="dropdown-separator" role="separator"></div>

          <button
            type="button"
            class="dropdown-menu-item signout-item"
            role="menuitem"
            (click)="handleSignOut()"
            data-testid="signout-button"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
            <span>Sign out</span>
          </button>
        </div>
      }
    </div>
  </div>
</aside>
